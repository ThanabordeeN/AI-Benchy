name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck & Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npm run type-check

      - name: Test Next.js Production Build
        run: npm run build

      - name: Download Neutralino Binaries
        run: npx @neutralinojs/neu update

      - name: Build Standalone Desktop Binaries
        run: npm run neu:build

      - name: Verify Build Artifacts
        run: |
          test -f dist/ai-benchy/ai-benchy-linux_x64 || (echo "Missing linux_x64 binary" && exit 1)
          test -f dist/ai-benchy/ai-benchy-win_x64.exe || (echo "Missing win_x64 binary" && exit 1)
          test -f dist/ai-benchy/resources.neu || (echo "Missing resources.neu" && exit 1)
          echo "All standalone binary artifacts verified successfully!"
